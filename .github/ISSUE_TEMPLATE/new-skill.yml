name: New skill proposal
description: Propose a repeatable Termux or Android decision that deserves a skill
title: "[skill] "
labels: ["new-skill"]
body:
  - type: markdown
    attributes:
      value: |
        A skill fits here when it encodes a repeatable operational decision. See CONTRIBUTING.md for the quality bar.
  - type: textarea
    id: decision
    attributes:
      label: What decision does the skill make?
      description: One or two sentences, for example "decide whether a Rust build failure needs a Termux package or a different wheel".
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms and exact error strings
      description: These become the trigger phrases, so exact text beats paraphrase.
      render: text
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Cheapest read-only check
      description: What can be inspected first without changing anything?
    validations:
      required: true
  - type: textarea
    id: mutations
    attributes:
      label: What would need confirmation or a rollback?
  - type: input
    id: neighbours
    attributes:
      label: Neighbouring skills
      description: Existing skills this would hand off to or from.
      placeholder: package-troubleshooting, proot-boundaries
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to write it?
      options:
        - Yes, I will open a pull request
        - I would like help
        - No, just proposing
